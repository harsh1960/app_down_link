<!DOCTYPE html>
<html>
<head>
    <title>Downloading Calixo...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        function redirect() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            
            // 1. Define your links here
            var oppoLink = "oppomarket://details?id=com.harsh.cal"; // Replace with your Package Name
            var indusLink = "https://www.indusappstore.com/apps/tools/calixo/com.harsh.cal/?page=details&id=com.harsh.cal"; // Replace with your Indus Link
            
            // 2. Check for Oppo, Realme, or OnePlus identifiers
            if (/OPPO|Realme|OnePlus/i.test(userAgent)) {
                // Try to open the Store App
                window.location.href = oppoLink;
                
                // Fallback: If the store app doesn't open in 2 seconds, go to Indus Web
                setTimeout(function() {
                    window.location.href = indusLink;
                }, 2000);
            } 
            // 3. Everyone else goes to Indus App Store
            else {
                window.location.href = indusLink;
            }
        }
    </script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f5f5f5; }
        .btn { display: block; width: 80%; margin: 20px auto; padding: 15px; background: #6200EE; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
        .sub { color: #666; font-size: 14px; }
    </style>
</head>
<body onload="redirect()">
    
    <h2>Redirecting to App Store...</h2>
    <p>If nothing happens, click below:</p>
    
    <a href="https://www.indusappstore.com/app/com.harsh.cal" class="btn">Download on Indus Store</a>
    
    <p class="sub">Calixo - Scientific Calculator</p>

</body>
</html>
